<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reen Bank - Transactions</title>
   <link href="./output.css" rel="stylesheet">
  <link rel="shortcut icon" href="assets/image 32.png" type="image/x-icon">
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#F6FBF9] text-[#073B2A] font-sans h-screen flex overflow-hidden relative">

   <!-- 1. Mobile Header -->
  <div class="lg:hidden absolute top-0 left-0 right-0 h-16 bg-[#F6FBF9] flex items-center justify-between px-6 border-b border-gray-100 z-40">
    <div class="flex items-center gap-2">
     

      <img src="assets/logo.png" alt="Reen Bank" class="h-5">
    </div>
    <!-- Added ID here to trigger the JS -->
    <button id="mobile-menu-btn" class="text-gray-500 hover:text-[#073B2A] transition-colors focus:outline-none">
      <i data-lucide="menu" class="w-6 h-6"></i>
    </button>
  </div>

  <!-- 2. Dark Overlay (Hidden by default, covers screen behind menu) -->
  <div id="mobile-overlay" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity duration-300 opacity-0 lg:hidden backdrop-blur-sm"></div>

  <!-- 3. Sidebar Menu (Slides in from the left on mobile, static on desktop) -->
  <aside id="mobile-sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-[#F6FBF9] flex flex-col justify-between py-8 px-6 border-r border-gray-100 transform -translate-x-full transition-transform duration-300 lg:relative lg:translate-x-0 lg:flex h-full">
    
    <div>
      <!-- Top: Logo and Close Button -->
      <div class="flex items-center justify-between mb-12">
        <div class="flex items-center gap-3">
          <div class="w-24 h-24  rounded-xl flex items-center justify-center font-bold">
            <img src="assets/logo.png" alt="">
          </div>
          <h1 class="text-2xl font-bold text-gray-900 hidden lg:block">Reen Bank</h1>
        </div>
        
        <!-- Close button (Only visible on mobile) -->
        <button id="close-menu-btn" class="lg:hidden text-gray-400 hover:text-gray-800 focus:outline-none">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Navigation Links -->
      <nav class="space-y-6">
        <a href="overview.html" class="flex items-center gap-4 text-gray-500 hover:text-[#073B2A] transition-colors">
          <i data-lucide="layout-grid" class="w-5 h-5"></i> Overview
        </a>
        <a href="account.html" class="flex items-center gap-4 text-[#19B66B] font-semibold">
          <i data-lucide="credit-card" class="w-5 h-5"></i> Accounts
        </a>
        <a href="transaction.html" class="flex items-center gap-4 text-gray-500 hover:text-[#073B2A] transition-colors">
          <i data-lucide="arrow-left-right" class="w-5 h-5"></i> Transactions
        </a>
        <a href="profile.html" class="flex items-center gap-4 text-gray-500 hover:text-[#073B2A] transition-colors">
          <i data-lucide="user" class="w-5 h-5"></i> Profile
        </a>
      </nav>
    </div>

    <!-- Logout Link at the Bottom -->
    <a href="#" id="logout-btn" class="flex items-center gap-4 text-[#FA6E6E] hover:text-red-700 transition-colors mt-auto font-medium">
      <i data-lucide="log-out" class="w-5 h-5"></i> Logout
    </a>
  </aside>


  <!-- Main Content -->
  <main class="flex-1 flex flex-col pt-20 lg:pt-8 pb-8 px-6 lg:px-10 overflow-y-auto w-full">
    
    <!-- Top Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10 w-full">
      <h2 class="text-3xl font-bold text-gray-900">Transactions</h2>
      
      <div class="flex flex-wrap md:flex-nowrap items-center gap-6 md:gap-10">
       <div class="flex flex-col items-end hidden sm:flex">
  <!-- Added ID here -->
  <span id="display-user-name" class="text-[#19B66B] text-sm font-medium">Maureen Oguche</span>
  
  <!-- Added ID here -->
  <span id="display-user-account" class="font-bold text-lg">1234567890</span>
</div>

      <!-- UPDATED SEARCH AND NOTIFICATION SECTION -->
<div class="flex items-center gap-4 md:gap-6 w-full md:w-auto justify-between md:justify-end">
  
  <!-- SEARCH -->
  <div class="relative flex-1 md:flex-none">
    <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
    <input type="text" id="global-search" placeholder="Search transactions..." class="pl-10 pr-4 py-2 rounded-full bg-white border border-gray-100 outline-none shadow-sm text-sm w-full md:w-64 focus:ring-2 focus:ring-[#DDF7EE]">
  </div>
  
  <!-- NOTIFICATIONS -->
  <div class="relative hidden sm:block">
   <button id="noti-btn" class="cursor-pointer relative text-gray-500 hover:text-[#073B2A] transition-colors mt-1">
  <i data-lucide="bell" class="w-6 h-6"></i>
  <!-- New Counter Badge -->
  <span id="noti-badge" class="absolute -top-1.5 -right-1.5 w-4 h-4 bg-red-500 text-white text-[10px] font-bold flex items-center justify-center rounded-full border border-[#F6FBF9] hidden">
    0
  </span>
</button>

    <!-- Notification Dropdown -->
    <div id="noti-dropdown" class="absolute right-0 mt-3 w-80 bg-white rounded-2xl shadow-xl border border-gray-100 hidden z-50 overflow-hidden">
      <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
        <h4 class="font-bold text-gray-900">Notifications</h4>
        <button id="clear-noti" class="text-xs text-[#19B66B] font-semibold hover:underline">Mark all read</button>
      </div>
      <div id="noti-list" class="max-h-80 overflow-y-auto">
        <!-- Notifications will be injected here by JS -->
      </div>
    </div>
  </div>

 <a href="profile.html">
    <img src="https://i.pravatar.cc/150?img=12" alt="Profile" class="w-10 h-10 rounded-full object-cover border border-gray-200 hidden sm:block">
</a>
</div>
      </div>
    </header>

    <!-- Content Area -->
    <div class="flex flex-col gap-10 max-w-7xl w-full">
      
      <!-- Account Selectors (Top Cards) -->
      <section>
        <div id="tx-accounts-wrapper" class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <!-- Dynamically generated account summary cards will go here -->
        </div>
      </section>

      <!-- Transactions Full List -->
      <section class="bg-[#F6FBF9]">
        <!-- Responsive Table Wrapper -->
        <div class="w-full overflow-x-auto hide-scrollbar pb-10">
          <div id="tx-full-list" class="min-w-[800px] flex flex-col space-y-4">
            <!-- Full transactions injected dynamically here -->
          </div>
        </div>
      </section>

    </div>
  </main>



  <!-- LOGOUT MODAL -->
<div id="logout-modal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
  <div class="bg-white rounded-2xl p-8 w-full max-w-sm shadow-2xl transform transition-all text-center">
    
    <!-- Icon -->
    <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-red-500/10">
      <i data-lucide="log-out" class="w-8 h-8 text-red-500"></i>
    </div>
    
    <!-- Text -->
    <h3 class="text-2xl font-bold text-gray-900 mb-2">Sign Out</h3>
    <p class="text-gray-500 text-sm mb-8">Are you sure you want to log out of your Reen Bank account?</p>
    
    <!-- Buttons -->
    <div class="flex gap-4">
      <button id="cancel-logout" class="flex-1 bg-gray-100 text-gray-600 font-bold py-3.5 rounded-xl hover:bg-gray-200 transition-colors">
        Cancel
      </button>
      <button id="confirm-logout" class="flex-1 bg-[#FA6E6E] text-white font-bold py-3.5 rounded-xl hover:bg-red-600 transition-colors">
        Yes, Logout
      </button>
    </div>
    
  </div>
</div>
  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="auth.js"></script>
  <script src="logout.js"></script>
  <script src="transaction.js"></script>
  <script src="dashboard-ui.js"></script>
</body>
</html>
