<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Reen Bank - Create Account</title>
  <link href="./output.css" rel="stylesheet">
  <link rel="shortcut icon" href="assets/image 32.png" type="image/x-icon">
</head>
<body class="font-sans">
       <!-- REGISTER PAGE -->
  <main
    id="register-page"
    class="min-h-screen  bg-reen-light flex flex-col lg:flex-row"
  >
         <!-- LEFT SIDE — REEN HERO -->
    <section
      id="register-hero"
      class="relative overflow-hidden w-full lg:w-1/2 min-h-[520px] lg:min-h-screen"
    >
      <!-- Decorative circles -->
      <div
        class="absolute -top-24 -left-24 w-72 h-72 rounded-full bg-white/10"
      ></div>
      <div
        class="absolute -bottom-32 -left-20 w-80 h-80 rounded-full bg-reen-dark/10"
      ></div>
      <div
        class="absolute top-1/2 -right-32 w-96 h-96 rounded-full bg-white/10"
      ></div>
      <!-- HERO CONTENT -->
      <div
        class="relative z-10 h-full min-h-[520px] lg:min-h-screen flex flex-col px-6 sm:px-10 lg:px-16 xl:px-20 py-8 lg:py-10"
      >
        <!-- LOGO -->
        <div
          id="register-logo"
          class="flex items-center"
        >
        <a href="index.html">

            <!-- Replace src with your Reen logo -->
            <img
            src="assets/logo.png"
            alt="Reen Bank"
            class="w-28 sm:w-32 h-auto object-contain"
            >
        </a>
        </div>
        <!-- HERO TEXT -->
       <div
  id="register-hero-content"
  class="flex-1 flex flex-col justify-center max-w-none py-16 lg:py-0"
>
          <!-- Small label -->
          <p
            class="text-sm font-medium text-reen-dark mb-4"
          >
            Reen Bank
          </p>
          <!-- Heading -->
        <h1
  class="text-4xl sm:text-5xl xl:text-6xl font-bold tracking-tight leading-[1.05] text-black"
>
 Welcome Back!
</h1>
          <!-- Description -->
          <p
            class="mt-6 max-w-md text-sm sm:text-base leading-7 text-reen-dark/70"
          >
           Enter Your Details To Login To Your Banking Dashboard Again
          </p>
        </div>
      </div>
    </section>
         <!-- RIGHT SIDE — REGISTRATION -->
<section
  id="register-form-section"
  class="w-full lg:w-1/2 flex items-center justify-start px-6 sm:px-10 lg:px-8 xl:px-12 py-10 lg:py-12"
>
  <div
    id="register-form-wrapper"
    class="w-full max-w-xl bg-white rounded-3xl px-7 py-7 sm:px-9 sm:py-8 lg:px-10 lg:py-8 shadow-sm"
  >
        <!-- FORM HEADER -->
          <h1
            class="text-3xl font-medium text-reen-green mb-11"
          >
           Login
          </h1>
             <!-- REGISTRATION FORM -->
        <form
          id="login-form"
          class="space-y-5"
          onsubmit="event.preventDefault();"
        >
          <!-- EMAIL -->
          <div
            id="email-field"
            class="space-y-2 "
          >
            <label
              for="email"
              class="block text-sm font-medium text-reen-dark"
            >
              Email address
            </label>
            <div class="relative">
                <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
                placeholder="Enter your email address"
                class="w-full px-4 py-3.5 rounded-xl border border-gray-200 bg-gray-50 text-sm text-reen-dark placeholder:text-gray-400 outline-none transition focus:border-reen-green focus:bg-white focus:ring-2 focus:ring-reen-green/10"
                >
                <i
                data-lucide="mail"
                class="w-5 h-5 absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"
                ></i>
            </div>
          </div>
          <!-- PASSWORD -->
          <div
            id="password-field"
            class="space-y-2"
          >
            <label
              for="password"
              class="block text-sm font-medium text-reen-dark"
            >
              Password
            </label>
            <div
              class="relative"
            >
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Create a password"
                class="w-full px-4 py-3.5 pr-12 rounded-xl border border-gray-200 bg-gray-50 text-sm text-reen-dark placeholder:text-gray-400 outline-none transition focus:border-reen-green focus:bg-white focus:ring-2 focus:ring-reen-green/10"
              >
              <!-- READY FOR JS -->
              <button
                id="toggle-password"
                type="button"
                aria-label="Show password"
                class="cursor-pointer absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-reen-green transition"
              >
                <i
                  data-lucide="eye"
                  class="w-5 h-5"
                ></i>
              </button>
            </div>
          </div>
          <!-- TERMS -->
          <!-- SUBMIT -->
          <button
            id="register-submit"
            type="submit"
            class="cursor-pointer w-full mt-3 py-3.5 px-6 rounded-2xl bg-reen-green text-white text-sm font-bold hover:bg-reen-green/90 active:scale-[0.99] transition flex items-center justify-center gap-2"
          >
            Login
            <i
              data-lucide="arrow-right"
              class="w-4 h-4"
            ></i>
          </button>
        </form>
        <!-- LOGIN -->
        <p
          class="mt-7 text-center text-sm text-gray-500"
        >
          Don't an account?
          <a
            id="login-link"
            href="register.html"
            class="font-semibold text-reen-green hover:underline"
          >
            Register
          </a>
        </p>
      </div>
    </section>
  </main>
     <!-- LOGIN MODAL -->
<div
  id="login-modal"
  class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-6"
>
  <div
    id="login-modal-content"
    class="w-full max-w-sm rounded-3xl bg-white p-7 sm:p-8 text-center shadow-xl"
  >
    <!-- ICON -->
    <div
      id="modal-icon-wrapper"
      class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-reen-green/10"
    >
      <i
        id="modal-icon"
        data-lucide="check"
        class="w-8 h-8 text-reen-green"
      ></i>
    </div>
    <!-- TITLE -->
    <h2
      id="modal-title"
      class="text-2xl font-semibold text-reen-dark"
    >
      Login successful
    </h2>
    <!-- MESSAGE -->
    <p
      id="modal-message"
      class="mt-3 text-sm leading-6 text-gray-500"
    >
      Welcome back! You are being redirected to your dashboard.
    </p>
    <!-- BUTTON -->
    <button
      id="modal-button"
      type="button"
      class="cursor-pointer mt-7 w-full rounded-2xl bg-reen-green py-3.5 text-sm font-bold text-white transition hover:bg-reen-green/90"
    >
      Continue
    </button>
  </div>
</div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
  <!-- Future JavaScript -->
 <script src="login.js"></script>
</body>
</html>
